version: 2
updates:
  # Android / Gradle
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "chore"
      - "dependabot"
    groups:
      gradle-stable:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Backend Python — gerenciado por uv (lockfile em backend/uv.lock)
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "chore"
      - "dependabot"
    groups:
      python-stable:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "chore"
      - "dependabot"
