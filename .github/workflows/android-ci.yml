name: Android CI

# Wrapper fino sobre o workflow reutilizável verify-android.
# Mantido para preservar o histórico do CI (este arquivo já existia no PR #29).

on:
  push:
    branches: [master]
    paths: ["android/**"]
  pull_request:
    paths: ["android/**"]

permissions:
  contents: read

jobs:
  verify-android:
    uses: ./.github/workflows/verify-android.yml
    with:
      gradle-task: "assembleDebug"
      run-ktlint: "yes"
      run-tests: "yes"
