name: Backend CI

on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Verificar projeto backend
        id: guard
        working-directory: ${{ github.workspace }}
        run: |
          if [ ! -d backend ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Diretório backend/ ainda não existe. Job encerrado sem falha."
            exit 0
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"
          if [ -f backend/requirements.txt ]; then
            echo "has_requirements=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_requirements=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f backend/pyproject.toml ]; then
            echo "has_pyproject=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_pyproject=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.present == 'true' && steps.guard.outputs.has_requirements == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.present == 'true' && steps.guard.outputs.has_requirements != 'true'
        with:
          python-version: "3.12"

      - name: Instalar dependências
        if: steps.guard.outputs.present == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif [ -f pyproject.toml ]; then
            pip install -e ".[dev]" 2>/dev/null || pip install -e . 2>/dev/null || true
          fi

      - name: Ruff (lint)
        if: steps.guard.outputs.present == 'true'
        run: ruff check .

      - name: Ruff (format check)
        if: steps.guard.outputs.present == 'true'
        run: |
          if ruff format --help >/dev/null 2>&1; then
            ruff format --check . || echo "Formatação ainda não padronizada; avisar no PR"
          fi
        continue-on-error: true

      - name: Testes
        if: steps.guard.outputs.present == 'true'
        run: |
          if [ -d tests ] || [ -d test ] || ls test_*.py *_test.py 2>/dev/null | grep -q .; then
            pytest -q
          else
            echo "Sem testes ainda; pulando"
          fi
