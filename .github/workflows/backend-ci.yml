name: Backend CI

on:
  push:
    branches: [master]
    paths: ["backend/**"]
  pull_request:
    paths: ["backend/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # uv (Astral) é o gerenciador de pacotes Python. Muito mais rápido que pip,
      # resolve um lockfile determinístico (uv.lock) e gerencia o venv.
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Sincronizar dependências (frozen)
        run: uv sync --frozen --group dev

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Testes
        run: |
          if [ -d tests ]; then
            uv run pytest
          else
            echo "sem testes ainda, pulando"
          fi
