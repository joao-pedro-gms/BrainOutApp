name: Backend CI

on:
  push:
    branches: [master]
    paths: ["backend/**"]
  pull_request:
    paths: ["backend/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Ruff (lint)
        run: ruff check .

      - name: Testes
        run: |
          if [ -d tests ]; then pip install pytest && pytest; else echo "sem testes ainda, pulando"; fi
