name: Deploy wireframes to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'prototipos/wireframes/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copiar wireframes para pasta de publicacao
        run: |
          # Como actions/upload-pages-artifact@v3 trata o 'path' como raiz do site,
          # copiamos o conteudo de prototipos/wireframes/ direto. Resultado: o Pages
          # serve em https://joao-pedro-gms.github.io/BrainOutApp/
          mkdir -p dist-for-pages
          cp -r prototipos/wireframes/. dist-for-pages/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-for-pages

  deploy-pages:
    needs: deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
