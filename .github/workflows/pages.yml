name: Deploy wireframes to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'prototipos/wireframes/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copiar wireframes para pasta de publicacao
        run: |
          # O Pages serve em /$repo/. Para a URL
          # https://joao-pedro-gms.github.io/BrainOutApp/prototipos/wireframes/
          # colocamos os arquivos em prototipos/wireframes/ dentro do artifact.
          mkdir -p dist-for-pages/prototipos/wireframes
          cp -r prototipos/wireframes/. dist-for-pages/prototipos/wireframes/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-for-pages/prototipos/wireframes

  deploy-pages:
    needs: deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
