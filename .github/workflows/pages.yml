name: Deploy prototipo to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'prototipos/web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:        # permite rodar manualmente em Actions

# Garante que só uma execução roda por vez (evita deploys conflitantes)
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write        # necessário para actions/deploy-pages

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototipos/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: prototipos/web/package-lock.json

      - name: Instalar dependências
        run: npm ci --include=dev --no-audit --no-fund

      - name: Build (Vite)
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: prototipos/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
