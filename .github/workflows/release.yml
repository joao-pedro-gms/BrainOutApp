name: Release

on:
  workflow_dispatch:        # botão manual em Actions
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Detectar Gradle wrapper
        id: gradle
        run: |
          if [ -x ./gradlew ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Gradle wrapper ausente. Issue #6 cria o wrapper; até lá, skip do build Android."
          fi

      - uses: gradle/actions/setup-gradle@v4
        if: steps.gradle.outputs.present == 'true'

      - name: Build APK debug
        if: steps.gradle.outputs.present == 'true'
        run: ./gradlew assembleDebug

      - name: Anexar APK ao run
        if: steps.gradle.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  build-release-apk:
    runs-on: ubuntu-latest
    needs: build-debug-apk
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK release
        run: ./gradlew assembleRelease

      - name: Anexar APK release
        if: hashFiles('android/app/build/outputs/apk/release/app-release.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Criar release do GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
