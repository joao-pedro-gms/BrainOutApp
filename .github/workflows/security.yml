name: Security

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 12 * * 1" # toda segunda, 12h UTC

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # gitleaks-action@v2 passou a exigir licença comercial; usamos a CLI oficial
      # (open source, sem custo). Instalada no runner Ubuntu padrão.
      - name: Instalar gitleaks
        run: |
          curl -sSfL https://raw.githubusercontent.com/gitleaks/gitleaks/v8.18.4/scripts/install.sh | sh -s v8.18.4

      - name: Rodar gitleaks
        run: gitleaks detect --source . --redact --no-banner

  # Checagem de dependências do backend com pip-audit, quando existir
  dep-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: pip-audit
        run: |
          if [ -f backend/requirements.txt ]; then
            pip install pip-audit
            pip-audit -r backend/requirements.txt || exit 1
          else
            echo "backend/requirements.txt ainda não existe, pulando"
          fi
