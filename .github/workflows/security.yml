name: Security

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 12 * * 1" # toda segunda, 12h UTC

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # gitleaks-action@v2 passou a exigir licença comercial; usamos a CLI oficial
      # (open source, sem custo). Binário baixado direto do release do GitHub.
      - name: Instalar gitleaks
        run: |
          set -euo pipefail
          VERSION="8.18.4"
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfL "$URL" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          chmod +x /usr/local/bin/gitleaks
          gitleaks version

      - name: Rodar gitleaks
        run: gitleaks detect --source . --redact --no-banner

  # Checagem de dependências do backend com pip-audit, quando existir
  dep-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: pip-audit
        run: |
          if [ -f backend/requirements.txt ]; then
            pip install pip-audit
            pip-audit -r backend/requirements.txt || exit 1
          else
            echo "backend/requirements.txt ainda não existe, pulando"
          fi
