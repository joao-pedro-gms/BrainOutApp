name: Security

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 12 * * 1" # toda segunda, 12h UTC

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2

  # Checagem de dependências do backend com pip-audit, quando existir
  dep-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: pip-audit
        run: |
          if [ -f backend/requirements.txt ]; then
            pip install pip-audit
            pip-audit -r backend/requirements.txt || exit 1
          else
            echo "backend/requirements.txt ainda não existe, pulando"
          fi
