name: Security

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 12 * * 1" # toda segunda, 12h UTC
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # CLI direto evita a API de PRs (gitleaks-action exige pull-requests:read e falha
      # quando o token do workflow está restrito).
      - name: Instalar gitleaks
        env:
          GITLEAKS_VERSION: "8.24.3"
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan de secrets
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
            gitleaks detect --source . --redact --verbose --exit-code 1 \
              --log-opts="${BASE}..${HEAD}"
          else
            gitleaks detect --source . --redact --verbose --exit-code 1
          fi

  dep-audit-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar requirements
        id: guard
        run: |
          if [ -f backend/requirements.txt ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "backend/requirements.txt ainda não existe; pulando pip-audit"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.present == 'true'
        with:
          python-version: "3.12"

      - name: pip-audit
        if: steps.guard.outputs.present == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r backend/requirements.txt

  # Quando o app Android existir, audita dependências Gradle (OWASP Dependency-Check leve via gradle se disponível)
  dep-audit-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar projeto Android
        id: guard
        run: |
          if [ -d android ] && [ -x android/gradlew ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Projeto Android ainda não existe; pulando auditoria Gradle"
          fi

      - uses: actions/setup-java@v4
        if: steps.guard.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        if: steps.guard.outputs.present == 'true'

      - name: Listar dependências (inventário)
        if: steps.guard.outputs.present == 'true'
        working-directory: android
        run: |
          ./gradlew :app:dependencies --configuration debugRuntimeClasspath --no-daemon \
            || ./gradlew dependencies --no-daemon \
            || echo "Não foi possível listar dependências; revisar quando o módulo app existir"
