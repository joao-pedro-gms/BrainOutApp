name: Verify Android (reutilizavel)

on:
  workflow_call:
    inputs:
      gradle-task:
        description: "Tarefa Gradle a executar"
        required: false
        type: string
        default: "assembleDebug"
      run-ktlint:
        description: "Rodar ktlintCheck"
        required: false
        type: string
        default: "yes"
      run-tests:
        description: "Rodar testDebugUnitTest"
        required: false
        type: string
        default: "yes"
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  verify-android:
    name: Verify Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Android SDK 34
        run: |
          set -e
          ANDROID_SDK_ROOT="$RUNNER_TEMP/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          cd "$ANDROID_SDK_ROOT/cmdline-tools"
          if [ ! -d "latest" ]; then
            curl -sSL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q cmdline-tools.zip
            mv cmdline-tools latest
            rm cmdline-tools.zip
          fi
          export ANDROID_SDK_ROOT
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          # Cria local.properties com sdk.dir explicito para evitar
          # conflito entre ANDROID_HOME e sdk.dir detectado pelo Gradle.
          # Removido no fim do job para nao vazar no commit (mesmo que
          # .gitignore ja cubra local.properties, e defensivo).
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          echo "android/local.properties" >> .gitignore-safe
          trap 'rm -f android/local.properties' EXIT

      - name: Detectar Gradle wrapper
        id: gradle
        working-directory: android
        run: |
          chmod +x ./gradlew 2>/dev/null || true
          chmod +x ./gradle/wrapper/gradle-wrapper.jar 2>/dev/null || true
          if ./gradlew --version >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::error::gradlew nao executavel em $(pwd)"
            exit 1
          fi

      - uses: gradle/actions/setup-gradle@v4
        if: steps.gradle.outputs.present == 'true'

      - name: Verificar estrutura minima
        working-directory: android
        run: |
          set -e
          test -f app/build.gradle.kts || { echo "::error::app/build.gradle.kts ausente"; exit 1; }
          test -f app/src/main/AndroidManifest.xml || { echo "::error::AndroidManifest.xml ausente"; exit 1; }
          test -f app/src/main/java/com/joaopedrogms/brainoutapp/BrainOutApp.kt || { echo "::error::BrainOutApp.kt ausente"; exit 1; }
          test -f gradle/libs.versions.toml || { echo "::error::version catalog ausente"; exit 1; }
          echo OK

      - name: Verificar libs.versions.toml
        working-directory: android
        run: python3 -c "import tomllib; tomllib.load(open('gradle/libs.versions.toml','rb')); print('TOML OK')"

      - name: Verificar imports Kotlin
        working-directory: android
        run: |
          for f in $(find app/src/main -name '*.kt' 2>/dev/null); do
            if grep -q 'Modifier\.padding' "$f" && ! grep -q 'import androidx\.compose\.foundation\.layout\.padding' "$f"; then
              echo "::error::$f usa Modifier.padding sem import"
              exit 1
            fi
          done
          echo OK

      - name: ktlintCheck
        if: steps.gradle.outputs.present == 'true' && (inputs.run-ktlint == 'yes' || inputs.run-ktlint == '')
        working-directory: android
        run: ./gradlew ktlintCheck

      - name: Testes unitarios
        if: steps.gradle.outputs.present == 'true' && (inputs.run-tests == 'yes' || inputs.run-tests == '')
        working-directory: android
        run: ./gradlew testDebugUnitTest

      - name: Build
        if: steps.gradle.outputs.present == 'true'
        working-directory: android
        run: ./gradlew ${{ inputs.gradle-task || 'assembleDebug' }}

      - name: Anexar APK
        if: steps.gradle.outputs.present == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ inputs.gradle-task || 'assembleDebug' }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Anexar relatorio
        if: (steps.gradle.outputs.present == 'true') && (always() || inputs.run-tests == 'yes' || inputs.run-tests == '')
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: android/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
