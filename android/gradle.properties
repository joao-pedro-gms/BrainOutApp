# JVM args para Gradle (aplicados ao daemon e a processos filhos).
# Valores calibrados para projetos Android Compose em CI (GitHub Actions, 4 GB).
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError

# Habilita cache de configuração e build cache (acelera builds incrementais).
org.gradle.configuration-cache=true
org.gradle.caching=true

# Paralelismo: respeita o CPU disponível.
org.gradle.parallel=true
org.gradle.daemon=true

# AndroidX é obrigatório a partir do AGP 8.x.
android.useAndroidX=true

# Kotlin: idioma do projeto.
kotlin.code.style=official

# Não gerar recursos não usados (Reduz APK).
android.nonTransitiveRClass=true
android.nonFinalResIds=true
