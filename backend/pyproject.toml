[project]
name = "brainoutapp-backend"
version = "0.1.0"
description = "API REST para o BrainOutApp (Projeto Integrador ADS 2026/2)"
requires-python = ">=3.12"
license = { text = "MIT" }

# Dependências reais (fastapi, sqlalchemy, etc.) entram na issue #14.
dependencies = [
    "alembic>=1.13",
    "bcrypt>=4.0,<5.0",
    "email-validator>=2.2",
    "fastapi>=0.115",
    "passlib[bcrypt]>=1.7.4",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "uuid7>=0.1.0",
]

# Pacote gerenciado por uv (https://docs.astral.sh/uv/). Lockfile em uv.lock.
# Para usar: uv sync                  (instala tudo)
#            uv run pytest            (roda pytest no venv)
#            uv run ruff check .      (roda ruff no venv)
#            uv add fastapi           (adiciona dep + atualiza lock)
[tool.uv]
package = true                              # build wheel/sdist quando publicar
managed = true                              # uv gerencia o .venv

[dependency-groups]
# Grupo "dev" — instalado por padrão com `uv sync` em ambiente local.
# Use `uv sync --no-group dev` em produção ou containers.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "pip-audit>=2.7",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "PLR", "PTH", "ERA", "D"]
ignore = ["E501"]  # line-length é tratado pelo formatter

[tool.ruff.lint.per-file-ignores]
# Testes podem usar magic numbers (status codes) e não precisam de docstrings.
"tests/**" = ["PLR2004", "D", "PTH"]
"app/__init__.py" = ["D104"]
"tests/__init__.py" = ["D104"]
"app/**/__init__.py" = ["D104"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
