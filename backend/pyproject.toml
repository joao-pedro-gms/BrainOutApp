[project]
name = "gerenciadeprojetos-backend"
version = "0.1.0"
description = "API REST para o GerenciaDeProjetosApp (Projeto Integrador ADS 2026/2)"
requires-python = ">=3.12"
license = { text = "MIT" }

# Dependências reais (fastapi, sqlalchemy, etc.) entram na issue #14.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]
ignore = ["E501"]  # line-length é tratado pelo formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
