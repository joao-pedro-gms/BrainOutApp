<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 393 852" width="393" height="852" font-family="system-ui, -apple-system, sans-serif">
  <!-- =========================== -->
  <!-- WIREFRAME: Login             -->
  <!-- 1) Selecao de perfil        -->
  <!-- =========================== -->

  <!-- Fundo externo (cinza claro) -->
  <rect width="393" height="852" fill="#fafafa"/>

  <!-- Frame do celular -->
  <rect x="0.5" y="0.5" width="392" height="851" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>

  <!-- Status bar fake -->
  <rect x="0" y="0" width="393" height="32" fill="#ffffff"/>
  <text x="20" y="21" font-size="13" fill="#1f2937" font-weight="600">9:41</text>
  <rect x="350" y="14" width="18" height="10" rx="1" fill="none" stroke="#1f2937" stroke-width="1"/>
  <rect x="352" y="16" width="14" height="6" fill="#1f2937"/>
  <!-- notch -->
  <rect x="160" y="6" width="73" height="22" rx="11" fill="#1f2937"/>

  <!-- Conteudo centralizado -->
  <g transform="translate(0, 90)">
    <!-- Logo: quadrado com grade 2x2 -->
    <rect x="160" y="0" width="72" height="72" rx="18" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
    <g transform="translate(160, 0)" stroke="#6366f1" stroke-width="2" fill="none">
      <rect x="14" y="14" width="18" height="18" rx="2"/>
      <rect x="40" y="14" width="18" height="18" rx="2"/>
      <rect x="14" y="40" width="18" height="18" rx="2"/>
      <rect x="40" y="40" width="18" height="18" rx="2"/>
    </g>

    <!-- Titulo -->
    <text x="196" y="106" text-anchor="middle" font-size="24" font-weight="700" fill="#1f2937">BrainOutApp</text>
    <text x="196" y="126" text-anchor="middle" font-size="12" fill="#6b7280">Gestao de projetos e tarefas</text>

    <!-- Instrucao -->
    <text x="196" y="160" text-anchor="middle" font-size="11" fill="#374151">Escolha um perfil para entrar.</text>
    <text x="196" y="175" text-anchor="middle" font-size="11" fill="#374151">O prototipo simula 2 perfis (R2).</text>

    <!-- Card Ana Gerente (Gerente) -->
    <g transform="translate(28, 195)">
      <rect width="337" height="72" rx="12" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
      <!-- Avatar (placeholder com X) -->
      <circle cx="36" cy="36" r="18" fill="#e0e7ff"/>
      <text x="36" y="40" text-anchor="middle" font-size="10" fill="#9ca3af" font-family="ui-monospace, monospace">[x]</text>
      <!-- Nome + email -->
      <text x="68" y="32" font-size="14" font-weight="600" fill="#1f2937">Ana Gerente</text>
      <text x="68" y="50" font-size="11" fill="#9ca3af">ana@brainoutapp.dev</text>
      <!-- Badge -->
      <rect x="266" y="24" width="56" height="22" rx="11" fill="#e0e7ff"/>
      <text x="294" y="40" text-anchor="middle" font-size="11" font-weight="600" fill="#4f46e5">Gerente</text>
    </g>

    <!-- Card Carlos (Colaborador) -->
    <g transform="translate(28, 280)">
      <rect width="337" height="72" rx="12" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
      <circle cx="36" cy="36" r="18" fill="#e0e7ff"/>
      <text x="36" y="40" text-anchor="middle" font-size="10" fill="#9ca3af" font-family="ui-monospace, monospace">[x]</text>
      <text x="68" y="32" font-size="14" font-weight="600" fill="#1f2937">Carlos Colab.</text>
      <text x="68" y="50" font-size="11" fill="#9ca3af">carlos@brainoutapp.dev</text>
      <rect x="252" y="24" width="70" height="22" rx="11" fill="#e5e7eb"/>
      <text x="287" y="40" text-anchor="middle" font-size="11" font-weight="600" fill="#6b7280">Colaborador</text>
    </g>

    <!-- Rodape -->
    <text x="196" y="400" text-anchor="middle" font-size="10" fill="#9ca3af">Sem senha (prototipo - issue #7)</text>
  </g>

  <!-- Home indicator -->
  <rect x="130" y="838" width="133" height="4" rx="2" fill="#1f2937"/>

  <!-- Legenda wireframe -->
  <g transform="translate(0, 870)" font-family="ui-monospace, monospace">
    <text x="12" y="0" font-size="10" fill="#9ca3af">[ ] placeholder   [x] icone placeholder</text>
  </g>
</svg>
