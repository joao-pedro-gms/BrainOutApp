<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 393 852" width="393" height="852" font-family="system-ui, -apple-system, sans-serif">
  <!-- =========================== -->
  <!-- WIREFRAME: Detalhe projeto   -->
  <!-- 1) Header com seta voltar    -->
  <!-- 2) Info projeto + tarefas    -->
  <!-- =========================== -->

  <rect width="393" height="852" fill="#fafafa"/>
  <rect x="0.5" y="0.5" width="392" height="851" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>

  <rect x="0" y="0" width="393" height="32" fill="#ffffff"/>
  <text x="20" y="21" font-size="13" fill="#1f2937" font-weight="600">9:41</text>
  <rect x="350" y="14" width="18" height="10" rx="1" fill="none" stroke="#1f2937" stroke-width="1"/>
  <rect x="352" y="16" width="14" height="6" fill="#1f2937"/>
  <rect x="160" y="6" width="73" height="22" rx="11" fill="#1f2937"/>

  <!-- Header -->
  <g transform="translate(0, 32)">
    <rect width="393" height="56" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
    <rect x="12" y="12" width="32" height="32" rx="6" fill="#e0e7ff"/>
    <text x="28" y="32" text-anchor="middle" font-size="9" fill="#9ca3af" font-family="ui-monospace, monospace">[x]</text>
    <text x="52" y="30" font-size="11" font-weight="600" fill="#1f2937">[nome]</text>
    <text x="52" y="42" font-size="9" fill="#9ca3af">[Projeto]</text>

    <g transform="translate(120, 12)">
      <rect width="32" height="32" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
      <text x="16" y="20" text-anchor="middle" font-size="11" fill="#4f46e5" font-family="ui-monospace, monospace">[x]</text>
      <rect x="40" width="32" height="32" rx="6" fill="none" stroke="#9ca3af" stroke-width="1"/>
      <text x="56" y="20" text-anchor="middle" font-size="11" fill="#9ca3af" font-family="ui-monospace, monospace">[x]</text>
      <rect x="80" width="32" height="32" rx="6" fill="none" stroke="#9ca3af" stroke-width="1"/>
      <text x="96" y="20" text-anchor="middle" font-size="11" fill="#9ca3af" font-family="ui-monospace, monospace">[x]</text>
    </g>

    <g transform="translate(296, 12)">
      <rect width="32" height="32" rx="6" fill="none" stroke="#9ca3af" stroke-width="1"/>
      <text x="16" y="20" text-anchor="middle" font-size="11" fill="#9ca3af" font-family="ui-monospace, monospace">~</text>
      <circle cx="56" cy="16" r="14" fill="#e0e7ff" stroke="#6366f1" stroke-width="1"/>
      <text x="56" y="20" text-anchor="middle" font-size="11" fill="#6366f1" font-family="ui-monospace, monospace">[u]</text>
    </g>
  </g>

  <g transform="translate(0, 88)">
    <!-- Voltar -->
    <text x="14" y="20" font-size="12" fill="#4f46e5">&lt;- Projetos</text>

    <!-- Card info do projeto -->
    <g transform="translate(16, 32)">
      <rect width="361" height="106" rx="12" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
      <!-- Titulo + badge -->
      <text x="14" y="22" font-size="16" font-weight="700" fill="#1f2937">[Nome do projeto]</text>
      <rect x="270" y="10" width="78" height="20" rx="10" fill="#dbeafe"/>
      <text x="309" y="24" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">Em andamento</text>
      <!-- Descricao -->
      <text x="14" y="40" font-size="11" fill="#6b7280">[Descricao do projeto em 1-2 linhas]</text>
      <text x="14" y="54" font-size="11" fill="#6b7280">[Descricao continua]</text>
      <!-- Datas + tarefas -->
      <text x="14" y="78" font-size="10" fill="#9ca3af" font-family="ui-monospace, monospace">[cal] Inicio</text>
      <text x="80" y="78" font-size="11" fill="#374151">99/99/9999</text>
      <text x="150" y="78" font-size="10" fill="#9ca3af" font-family="ui-monospace, monospace">[cal] Prazo</text>
      <text x="208" y="78" font-size="11" fill="#374151">99/99/9999</text>
      <text x="14" y="96" font-size="10" fill="#9ca3af" font-family="ui-monospace, monospace">[clip] N tarefa(s)</text>
      <text x="100" y="96" font-size="11" fill="#374151">[N]</text>
    </g>

    <!-- Secao tarefas -->
    <text x="16" y="158" font-size="14" font-weight="600" fill="#1f2937">Tarefas</text>
    <rect x="290" y="142" width="87" height="28" rx="8" fill="#4f46e5"/>
    <text x="333" y="160" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">+ Nova tarefa</text>

    <!-- Tarefa 1 -->
    <g transform="translate(16, 176)">
      <rect width="361" height="68" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
      <text x="14" y="22" font-size="13" font-weight="500" fill="#1f2937">[Titulo da tarefa]</text>
      <rect x="240" y="10" width="56" height="20" rx="10" fill="#dcfce7"/>
      <text x="268" y="24" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">Concluida</text>
      <rect x="300" y="10" width="48" height="20" rx="10" fill="#fee2e2"/>
      <text x="324" y="24" text-anchor="middle" font-size="10" font-weight="600" fill="#991b1b">Alta</text>
      <text x="14" y="42" font-size="10" fill="#9ca3af" font-family="ui-monospace, monospace">[cal]</text>
      <text x="34" y="42" font-size="11" fill="#374151">Prazo: 99/99/9999</text>
      <rect x="280" y="38" width="68" height="22" rx="6" fill="none" stroke="#9ca3af" stroke-width="1"/>
      <text x="314" y="53" text-anchor="middle" font-size="11" fill="#374151">[Botao]</text>
    </g>

    <!-- Tarefa 2 -->
    <g transform="translate(16, 256)">
      <rect width="361" height="68" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
      <text x="14" y="22" font-size="13" font-weight="500" fill="#1f2937">[Titulo da tarefa]</text>
      <rect x="232" y="10" width="64" height="20" rx="10" fill="#dbeafe"/>
      <text x="264" y="24" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">Em andamento</text>
      <rect x="300" y="10" width="48" height="20" rx="10" fill="#fef3c7"/>
      <text x="324" y="24" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">Media</text>
      <text x="14" y="42" font-size="10" fill="#9ca3af" font-family="ui-monospace, monospace">[cal]</text>
      <text x="34" y="42" font-size="11" fill="#374151">Prazo: 99/99/9999</text>
      <rect x="280" y="38" width="68" height="22" rx="6" fill="none" stroke="#9ca3af" stroke-width="1"/>
      <text x="314" y="53" text-anchor="middle" font-size="11" fill="#374151">[Botao]</text>
    </g>

    <!-- Tarefa 3 -->
    <g transform="translate(16, 336)">
      <rect width="361" height="68" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
      <text x="14" y="22" font-size="13" font-weight="500" fill="#1f2937">[Titulo da tarefa - atrasada]</text>
      <rect x="240" y="10" width="56" height="20" rx="10" fill="#f1f5f9"/>
      <text x="268" y="24" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">Aberta</text>
      <rect x="300" y="10" width="48" height="20" rx="10" fill="#fef3c7"/>
      <text x="324" y="24" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">Media</text>
      <rect x="263" y="36" width="86" height="20" rx="10" fill="#fee2e2"/>
      <text x="306" y="50" text-anchor="middle" font-size="10" font-weight="600" fill="#991b1b">[!] Atrasada</text>
      <text x="14" y="42" font-size="10" fill="#9ca3af" font-family="ui-monospace, monospace">[cal]</text>
      <text x="34" y="42" font-size="11" fill="#374151">Prazo: 99/99/9999</text>
    </g>

    <text x="196" y="430" text-anchor="middle" font-size="9" fill="#9ca3af" font-family="ui-monospace, monospace">... scroll ...</text>
  </g>

  <rect x="130" y="838" width="133" height="4" rx="2" fill="#1f2937"/>
</svg>
