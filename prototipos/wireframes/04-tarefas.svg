<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 393 852" width="393" height="852" font-family="system-ui, -apple-system, sans-serif">
  <!-- =========================== -->
  <!-- WIREFRAME: Tarefas (lista)   -->
  <!-- 1) Filtros                  -->
  <!-- 2) Cards de tarefa           -->
  <!-- =========================== -->

  <rect width="393" height="852" fill="#fafafa"/>
  <rect x="0.5" y="0.5" width="392" height="851" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>

  <rect x="0" y="0" width="393" height="32" fill="#ffffff"/>
  <text x="20" y="21" font-size="13" fill="#1f2937" font-weight="600">9:41</text>
  <rect x="350" y="14" width="18" height="10" rx="1" fill="none" stroke="#1f2937" stroke-width="1"/>
  <rect x="352" y="16" width="14" height="6" fill="#1f2937"/>
  <rect x="160" y="6" width="73" height="22" rx="11" fill="#1f2937"/>

  <!-- Header -->
  <g transform="translate(0, 32)">
    <rect width="393" height="56" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
    <rect x="12" y="12" width="32" height="32" rx="6" fill="#e0e7ff"/>
    <text x="28" y="32" text-anchor="middle" font-size="9" fill="#9ca3af" font-family="ui-monospace, monospace">[x]</text>
    <text x="52" y="30" font-size="11" font-weight="600" fill="#1f2937">[nome]</text>
    <text x="52" y="42" font-size="9" fill="#9ca3af">[Tarefa]</text>

    <g transform="translate(120, 12)">
      <rect width="32" height="32" rx="6" fill="none" stroke="#9ca3af" stroke-width="1"/>
      <text x="16" y="20" text-anchor="middle" font-size="11" fill="#9ca3af" font-family="ui-monospace, monospace">[x]</text>
      <rect x="40" width="32" height="32" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
      <text x="56" y="20" text-anchor="middle" font-size="11" fill="#4f46e5" font-family="ui-monospace, monospace">[x]</text>
      <rect x="80" width="32" height="32" rx="6" fill="none" stroke="#9ca3af" stroke-width="1"/>
      <text x="96" y="20" text-anchor="middle" font-size="11" fill="#9ca3af" font-family="ui-monospace, monospace">[x]</text>
    </g>

    <g transform="translate(296, 12)">
      <rect width="32" height="32" rx="6" fill="none" stroke="#9ca3af" stroke-width="1"/>
      <text x="16" y="20" text-anchor="middle" font-size="11" fill="#9ca3af" font-family="ui-monospace, monospace">~</text>
      <circle cx="56" cy="16" r="14" fill="#e0e7ff" stroke="#6366f1" stroke-width="1"/>
      <text x="56" y="20" text-anchor="middle" font-size="11" fill="#6366f1" font-family="ui-monospace, monospace">[u]</text>
    </g>
  </g>

  <g transform="translate(0, 88)">
    <!-- Titulo + botao -->
    <text x="16" y="20" font-size="20" font-weight="700" fill="#1f2937">Tarefas</text>
    <text x="16" y="38" font-size="11" fill="#6b7280">13 tarefa(s)</text>
    <rect x="290" y="8" width="87" height="32" rx="8" fill="#4f46e5"/>
    <text x="333" y="28" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">+ Nova</text>

    <!-- Card de filtros -->
    <g transform="translate(16, 50)">
      <rect width="361" height="120" rx="12" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
      <text x="14" y="18" font-size="10" font-weight="600" fill="#374151" font-family="ui-monospace, monospace">FILTROS</text>
      <!-- Buscar -->
      <rect x="14" y="28" width="333" height="22" rx="4" fill="none" stroke="#9ca3af" stroke-width="1"/>
      <text x="22" y="42" font-size="10" fill="#9ca3af">[lupa] Buscar titulo...</text>
      <!-- Status + Prioridade -->
      <rect x="14" y="58" width="160" height="22" rx="4" fill="none" stroke="#9ca3af" stroke-width="1"/>
      <text x="22" y="72" font-size="10" fill="#374151">[Status] [Todos]</text>
      <rect x="187" y="58" width="160" height="22" rx="4" fill="none" stroke="#9ca3af" stroke-width="1"/>
      <text x="195" y="72" font-size="10" fill="#374151">[Prior.] [Todas]</text>
      <!-- Responsavel -->
      <rect x="14" y="88" width="333" height="22" rx="4" fill="none" stroke="#9ca3af" stroke-width="1"/>
      <text x="22" y="102" font-size="10" fill="#374151">[Resp.] [Todos]</text>
    </g>

    <!-- Card tarefa 1 -->
    <g transform="translate(16, 184)">
      <rect width="361" height="84" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
      <text x="14" y="20" font-size="13" font-weight="500" fill="#1f2937">[Titulo da tarefa]</text>
      <rect x="234" y="8" width="56" height="20" rx="10" fill="#dcfce7"/>
      <text x="262" y="22" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">Concluida</text>
      <rect x="294" y="8" width="48" height="20" rx="10" fill="#fee2e2"/>
      <text x="318" y="22" text-anchor="middle" font-size="10" font-weight="600" fill="#991b1b">Alta</text>
      <!-- Linha meta: projeto + resp + data -->
      <text x="14" y="42" font-size="10" fill="#9ca3af" font-family="ui-monospace, monospace">[pasta]</text>
      <text x="36" y="42" font-size="11" fill="#374151">[Nome projeto]</text>
      <text x="14" y="58" font-size="10" fill="#9ca3af" font-family="ui-monospace, monospace">[user]</text>
      <text x="36" y="58" font-size="11" fill="#374151">[Responsavel]</text>
      <text x="14" y="74" font-size="10" fill="#9ca3af" font-family="ui-monospace, monospace">[cal]</text>
      <text x="36" y="74" font-size="11" fill="#374151">99/99/9999</text>
    </g>

    <!-- Card tarefa 2 (atrasada) -->
    <g transform="translate(16, 280)">
      <rect width="361" height="84" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
      <text x="14" y="20" font-size="13" font-weight="500" fill="#1f2937">[Titulo - atrasada]</text>
      <rect x="240" y="8" width="50" height="20" rx="10" fill="#f1f5f9"/>
      <text x="265" y="22" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">Aberta</text>
      <rect x="294" y="8" width="48" height="20" rx="10" fill="#fef3c7"/>
      <text x="318" y="22" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">Media</text>
      <rect x="100" y="32" width="86" height="20" rx="10" fill="#fee2e2"/>
      <text x="143" y="46" text-anchor="middle" font-size="10" font-weight="600" fill="#991b1b">[!] Atrasada</text>
      <text x="14" y="62" font-size="10" fill="#9ca3af" font-family="ui-monospace, monospace">[pasta] [user] [cal]</text>
      <text x="14" y="74" font-size="11" fill="#374151">[info - 1 linha]</text>
    </g>

    <!-- Card tarefa 3 (em andamento) -->
    <g transform="translate(16, 376)">
      <rect width="361" height="84" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
      <text x="14" y="20" font-size="13" font-weight="500" fill="#1f2937">[Titulo da tarefa]</text>
      <rect x="225" y="8" width="72" height="20" rx="10" fill="#dbeafe"/>
      <text x="261" y="22" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">Em andamento</text>
      <rect x="301" y="8" width="48" height="20" rx="10" fill="#fef3c7"/>
      <text x="325" y="22" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">Media</text>
      <text x="14" y="42" font-size="10" fill="#9ca3af" font-family="ui-monospace, monospace">[pasta]</text>
      <text x="36" y="42" font-size="11" fill="#374151">[Nome projeto]</text>
      <text x="14" y="58" font-size="10" fill="#9ca3af" font-family="ui-monospace, monospace">[user]</text>
      <text x="36" y="58" font-size="11" fill="#374151">[Responsavel]</text>
      <text x="14" y="74" font-size="10" fill="#9ca3af" font-family="ui-monospace, monospace">[cal]</text>
      <text x="36" y="74" font-size="11" fill="#374151">99/99/9999</text>
    </g>

    <text x="196" y="478" text-anchor="middle" font-size="9" fill="#9ca3af" font-family="ui-monospace, monospace">... scroll para mais ...</text>
  </g>

  <rect x="130" y="838" width="133" height="4" rx="2" fill="#1f2937"/>
</svg>
