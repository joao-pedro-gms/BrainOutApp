<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 393 852" width="393" height="852" font-family="system-ui, -apple-system, sans-serif">
  <!-- =========================== -->
  <!-- WIREFRAME: Form tarefa      -->
  <!-- 1) Form de criar/editar     -->
  <!-- 2) Cenario de erro RN03      -->
  <!-- =========================== -->

  <rect width="393" height="852" fill="#fafafa"/>
  <rect x="0.5" y="0.5" width="392" height="851" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>

  <rect x="0" y="0" width="393" height="32" fill="#ffffff"/>
  <text x="20" y="21" font-size="13" fill="#1f2937" font-weight="600">9:41</text>
  <rect x="350" y="14" width="18" height="10" rx="1" fill="none" stroke="#1f2937" stroke-width="1"/>
  <rect x="352" y="16" width="14" height="6" fill="#1f2937"/>
  <rect x="160" y="6" width="73" height="22" rx="11" fill="#1f2937"/>

  <!-- Header -->
  <g transform="translate(0, 32)">
    <rect width="393" height="56" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
    <rect x="12" y="12" width="32" height="32" rx="6" fill="#e0e7ff"/>
    <text x="28" y="32" text-anchor="middle" font-size="9" fill="#9ca3af" font-family="ui-monospace, monospace">[x]</text>
    <text x="52" y="30" font-size="11" font-weight="600" fill="#1f2937">[nome]</text>
    <text x="52" y="42" font-size="9" fill="#9ca3af">[Tarefa]</text>

    <g transform="translate(120, 12)">
      <rect width="32" height="32" rx="6" fill="none" stroke="#9ca3af" stroke-width="1"/>
      <rect x="40" width="32" height="32" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
      <rect x="80" width="32" height="32" rx="6" fill="none" stroke="#9ca3af" stroke-width="1"/>
    </g>

    <g transform="translate(296, 12)">
      <rect width="32" height="32" rx="6" fill="none" stroke="#9ca3af" stroke-width="1"/>
      <circle cx="56" cy="16" r="14" fill="#e0e7ff"/>
    </g>
  </g>

  <g transform="translate(0, 88)">
    <!-- Voltar -->
    <text x="14" y="20" font-size="12" fill="#4f46e5">&lt;- Voltar</text>

    <!-- Titulo -->
    <text x="16" y="50" font-size="20" font-weight="700" fill="#1f2937">Nova tarefa</text>

    <!-- Card do form -->
    <g transform="translate(16, 64)">
      <rect width="361" height="600" rx="12" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>

      <!-- ERRO (RN03) -->
      <g transform="translate(14, 18)">
        <rect width="333" height="48" rx="6" fill="#fee2e2"/>
        <text x="12" y="20" font-size="11" font-weight="600" fill="#991b1b">[!] Erro de validacao (RN03)</text>
        <text x="12" y="36" font-size="10" fill="#7f1d1d">Prazo da tarefa (99/99/9999) ultrapassa</text>
        <text x="12" y="46" font-size="10" fill="#7f1d1d">o prazo do projeto (99/99/9999).</text>
      </g>

      <!-- Titulo -->
      <text x="14" y="92" font-size="11" font-weight="600" fill="#374151">Titulo *</text>
      <rect x="14" y="100" width="333" height="36" rx="6" fill="none" stroke="#9ca3af" stroke-width="1"/>
      <text x="22" y="122" font-size="12" fill="#9ca3af">[Input texto]</text>

      <!-- Descricao -->
      <text x="14" y="152" font-size="11" font-weight="600" fill="#374151">Descricao</text>
      <rect x="14" y="160" width="333" height="56" rx="6" fill="none" stroke="#9ca3af" stroke-width="1"/>
      <text x="22" y="182" font-size="11" fill="#9ca3af">[Textarea - multi-linha]</text>

      <!-- Projeto (com info do prazo) -->
      <text x="14" y="234" font-size="11" font-weight="600" fill="#374151">Projeto *</text>
      <rect x="14" y="242" width="333" height="36" rx="6" fill="none" stroke="#9ca3af" stroke-width="1"/>
      <text x="22" y="264" font-size="12" fill="#374151">[Nome projeto (prazo 99/99/9999)]</text>
      <text x="14" y="290" font-size="9" fill="#92400e" font-family="ui-monospace, monospace">Prazo do projeto: 99/99/9999. RN03 bloqueia prazos maiores.</text>

      <!-- Responsavel -->
      <text x="14" y="314" font-size="11" font-weight="600" fill="#374151">Responsavel *</text>
      <rect x="14" y="322" width="333" height="36" rx="6" fill="none" stroke="#9ca3af" stroke-width="1"/>
      <text x="22" y="344" font-size="12" fill="#374151">[Nome do responsavel]</text>

      <!-- Prioridade + Status -->
      <text x="14" y="378" font-size="11" font-weight="600" fill="#374151">Prioridade</text>
      <rect x="14" y="386" width="160" height="36" rx="6" fill="none" stroke="#9ca3af" stroke-width="1"/>
      <text x="22" y="408" font-size="12" fill="#374151">[Media]</text>

      <text x="187" y="378" font-size="11" font-weight="600" fill="#374151">Status</text>
      <rect x="187" y="386" width="160" height="36" rx="6" fill="none" stroke="#9ca3af" stroke-width="1"/>
      <text x="195" y="408" font-size="12" fill="#374151">[Aberta]</text>

      <!-- Prazo (com erro) -->
      <text x="14" y="442" font-size="11" font-weight="600" fill="#374151">Prazo *</text>
      <rect x="14" y="450" width="333" height="36" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
      <text x="22" y="472" font-size="12" fill="#991b1b">[Data - invalida - 99/99/9999]</text>

      <!-- Divisor -->
      <line x1="14" y1="540" x2="347" y2="540" stroke="#e5e7eb" stroke-width="1"/>

      <!-- Botoes -->
      <rect x="14" y="556" width="160" height="32" rx="8" fill="none" stroke="#9ca3af" stroke-width="1"/>
      <text x="94" y="576" text-anchor="middle" font-size="12" fill="#374151">Cancelar</text>
      <rect x="187" y="556" width="160" height="32" rx="8" fill="#4f46e5"/>
      <text x="267" y="576" text-anchor="middle" font-size="12" fill="#ffffff">Criar tarefa</text>
    </g>
  </g>

  <rect x="130" y="838" width="133" height="4" rx="2" fill="#1f2937"/>
</svg>
