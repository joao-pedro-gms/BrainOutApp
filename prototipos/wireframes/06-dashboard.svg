      <text x="14" y="22" font-size="12" font-weight="600" fill="#1f2937">Tarefas em aberto por responsavel</text>
      <!-- Barras placeholder -->
      <text x="14" y="50" font-size="11" fill="#374151">Ana Gerente</text>
      <rect x="100" y="42" width="60" height="14" fill="#6366f1"/>
      <text x="170" y="53" font-size="11" fill="#374151">2</text>

      <text x="14" y="78" font-size="11" fill="#374151">Carlos Colab.</text>
      <rect x="100" y="70" width="180" height="14" fill="#6366f1"/>
      <text x="290" y="81" font-size="11" fill="#374151">6</text>

      <text x="14" y="106" font-size="11" fill="#374151">...</text>
      <line x1="14" y1="124" x2="200" y2="124" stroke="#e5e7eb" stroke-width="1"/>
      <text x="14" y="138" font-size="9" fill="#9ca3af" font-family="ui-monospace, monospace">[grafico barras - SVG puro]</text>
    </g>

    <!-- Grafico 2: Por projeto -->
    <g transform="translate(16, 412)">
      <rect width="361" height="148" rx="12" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
      <text x="14" y="22" font-size="12" font-weight="600" fill="#1f2937">Tarefas em aberto por projeto</text>
      <text x="14" y="50" font-size="11" fill="#374151">[Nome projeto]</text>
      <rect x="120" y="42" width="120" height="14" fill="#0ea5e9"/>
      <text x="250" y="53" font-size="11" fill="#374151">4</text>

      <text x="14" y="78" font-size="11" fill="#374151">[Nome projeto]</text>
      <rect x="120" y="70" width="120" height="14" fill="#0ea5e9"/>
      <text x="250" y="81" font-size="11" fill="#374151">4</text>

      <text x="14" y="106" font-size="11" fill="#374151">[Nome projeto]</text>
      <rect x="120" y="98" width="6" height="14" fill="#0ea5e9"/>
      <text x="250" y="109" font-size="11" fill="#374151">0</text>

      <text x="14" y="138" font-size="9" fill="#9ca3af" font-family="ui-monospace, monospace">[grafico barras - SVG puro]</text>
    </g>

    <!-- Lista: Proximas tarefas -->
    <g transform="translate(16, 576)">
      <rect width="361" height="160" rx="12" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
      <text x="14" y="22" font-size="12" font-weight="600" fill="#1f2937">Proximas tarefas a vencer</text>
      <text x="280" y="22" font-size="10" fill="#4f46e5">Ver todas -&gt;</text>
      <line x1="14" y1="32" x2="347" y2="32" stroke="#e5e7eb" stroke-width="1"/>

      <!-- Item 1 -->
      <text x="14" y="50" font-size="11" fill="#1f2937">[Titulo tarefa - atrasada]</text>
      <rect x="240" y="38" width="48" height="16" rx="8" fill="#f1f5f9"/>
      <text x="264" y="50" text-anchor="middle" font-size="9" fill="#475569">Aberta</text>
      <text x="298" y="50" font-size="11" font-weight="600" fill="#dc2626">99/99</text>

      <!-- Item 2 -->
      <text x="14" y="74" font-size="11" fill="#1f2937">[Titulo tarefa]</text>
      <rect x="232" y="62" width="56" height="16" rx="8" fill="#dbeafe"/>
      <text x="260" y="74" text-anchor="middle" font-size="9" fill="#1e40af">Em andam.</text>
      <text x="298" y="74" font-size="11" fill="#374151">99/99</text>

      <!-- Item 3 -->
      <text x="14" y="98" font-size="11" fill="#1f2937">[Titulo tarefa]</text>
      <rect x="232" y="86" width="56" height="16" rx="8" fill="#dbeafe"/>
      <text x="260" y="98" text-anchor="middle" font-size="9" fill="#1e40af">Em andam.</text>
      <text x="298" y="98" font-size="11" fill="#374151">99/99</text>

      <!-- Item 4 -->
      <text x="14" y="122" font-size="11" fill="#1f2937">[Titulo tarefa]</text>
      <rect x="240" y="110" width="48" height="16" rx="8" fill="#f1f5f9"/>
      <text x="264" y="122" text-anchor="middle" font-size="9" fill="#475569">Aberta</text>
      <text x="298" y="122" font-size="11" fill="#374151">99/99</text>

      <line x1="14" y1="138" x2="347" y2="138" stroke="#e5e7eb" stroke-width="1"/>
      <text x="14" y="152" font-size="9" fill="#9ca3af" font-family="ui-monospace, monospace">... 4 de 13 tarefas ...</text>
    </g>

    <text x="196" y="752" text-anchor="middle" font-size="9" fill="#9ca3af" font-family="ui-monospace, monospace">... scroll ...</text>
  </g>

  <rect x="130" y="838" width="133" height="4" rx="2" fill="#1f2937"/>
</svg>
