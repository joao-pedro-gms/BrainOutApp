<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 393 852" width="393" height="852" font-family="system-ui, -apple-system, sans-serif">
  <!-- =========================== -->
  <!-- WIREFRAME: Dashboard         -->
  <!-- 1) 4 KPI cards (2x2)        -->
  <!-- 2) 2 graficos placeholder   -->
  <!-- 3) Lista de proximas tarefas -->
  <!-- =========================== -->

  <rect width="393" height="852" fill="#fafafa"/>
  <rect x="0.5" y="0.5" width="392" height="851" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>

  <rect x="0" y="0" width="393" height="32" fill="#ffffff"/>
  <text x="20" y="21" font-size="13" fill="#1f2937" font-weight="600">9:41</text>
  <rect x="350" y="14" width="18" height="10" rx="1" fill="none" stroke="#1f2937" stroke-width="1"/>
  <rect x="352" y="16" width="14" height="6" fill="#1f2937"/>
  <rect x="160" y="6" width="73" height="22" rx="11" fill="#1f2937"/>

  <!-- Header -->
  <g transform="translate(0, 32)">
    <rect width="393" height="56" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
    <rect x="12" y="12" width="32" height="32" rx="6" fill="#e0e7ff"/>
    <text x="28" y="32" text-anchor="middle" font-size="9" fill="#9ca3af" font-family="ui-monospace, monospace">[x]</text>
    <text x="52" y="30" font-size="11" font-weight="600" fill="#1f2937">[nome]</text>
    <text x="52" y="42" font-size="9" fill="#9ca3af">[Dashboard]</text>

    <g transform="translate(120, 12)">
      <rect width="32" height="32" rx="6" fill="none" stroke="#9ca3af" stroke-width="1"/>
      <rect x="40" width="32" height="32" rx="6" fill="none" stroke="#9ca3af" stroke-width="1"/>
      <rect x="80" width="32" height="32" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
    </g>

    <g transform="translate(296, 12)">
      <rect width="32" height="32" rx="6" fill="none" stroke="#9ca3af" stroke-width="1"/>
      <circle cx="56" cy="16" r="14" fill="#e0e7ff"/>
    </g>
  </g>

  <g transform="translate(0, 88)">
