    <text x="16" y="20" font-size="20" font-weight="700" fill="#1f2937">Dashboard</text>
    <text x="16" y="38" font-size="11" fill="#6b7280">Visao consolidada para o Gerente.</text>

    <!-- 4 KPI cards em grid 2x2 -->
    <g transform="translate(16, 52)">
      <!-- Card 1: Concluidas -->
      <rect width="172" height="74" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
      <text x="12" y="22" font-size="9" font-weight="600" fill="#6b7280" font-family="ui-monospace, monospace">CONCLUIDAS</text>
      <text x="160" y="20" text-anchor="end" font-size="14" fill="#16a34a" font-family="ui-monospace, monospace">[check]</text>
      <text x="12" y="58" font-size="28" font-weight="700" fill="#16a34a">5</text>

      <!-- Card 2: Em aberto -->
      <rect x="189" width="172" height="74" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
      <text x="201" y="22" font-size="9" font-weight="600" fill="#6b7280" font-family="ui-monospace, monospace">EM ABERTO</text>
      <text x="349" y="20" text-anchor="end" font-size="14" fill="#2563eb" font-family="ui-monospace, monospace">[clip]</text>
      <text x="201" y="58" font-size="28" font-weight="700" fill="#2563eb">8</text>

      <!-- Card 3: Atrasadas (destaque) -->
      <rect y="90" width="172" height="74" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
      <text x="12" y="112" font-size="9" font-weight="600" fill="#6b7280" font-family="ui-monospace, monospace">ATRASADAS</text>
      <text x="160" y="110" text-anchor="end" font-size="14" fill="#dc2626" font-family="ui-monospace, monospace">[!]</text>
      <text x="12" y="148" font-size="28" font-weight="700" fill="#dc2626">1</text>

      <!-- Card 4: Vencem em 7 dias -->
      <rect x="189" y="90" width="172" height="74" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
      <text x="201" y="112" font-size="9" font-weight="600" fill="#6b7280" font-family="ui-monospace, monospace">VENCEM 7D</text>
      <text x="349" y="110" text-anchor="end" font-size="14" fill="#d97706" font-family="ui-monospace, monospace">[cal]</text>
      <text x="201" y="148" font-size="28" font-weight="700" fill="#d97706">3</text>
    </g>

    <!-- Grafico 1: Por responsavel -->
    <g transform="translate(16, 248)">
